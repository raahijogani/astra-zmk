CONFIG_ZMK_POINTING=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_BAS=y
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_VFX=y
CONFIG_ZMK_VFX_AUTO_POWER_GATE=y
CONFIG_ZMK_VFX_AUTO_OFF_IDLE=y
CONFIG_ZMK_VFX_BLACKOUT_DELAY_MS=500
CONFIG_ZMK_VFX_SPLIT_SYNCED=y
CONFIG_ZMK_VFX_SYNC_RELAY_KEYS=y

# VFX owns the strip; enable its SPI driver and switched VCC supply.
CONFIG_SPI=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_PM_DEVICE=y
CONFIG_ZMK_VFX_SUSPEND_STRIP_BUS=y
